<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A student finance tracker for budgeting and expense tracking.">
    <title>Student Finance Tracker</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Navigation Sidebar/Bottom Bar -->
        <nav class="main-nav" role="navigation" aria-label="Main Navigation">
            <div class="nav-brand">
                <span class="brand-icon"></span>
                <span class="brand-text">FinanceTracker</span>
            </div>
            <button class="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html" class="active" aria-current="page"><span class="icon"></span><span
                            class="label">Dashboard</span></a></li>
                <li><a href="pages/records.html"><span class="icon"></span><span class="label">Records</span></a></li>
                <li><a href="pages/add.html"><span class="icon"></span><span class="label">Add New</span></a></li>
                <li><a href="pages/settings.html"><span class="icon"></span><span class="label">Settings</span></a>
                </li>
                <li><a href="pages/about.html"><span class="icon"></span><span class="label">About</span></a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Header -->
            <header class="top-header">
                <h1>Dashboard</h1>
            </header>

            <!-- Dashboard Section -->
            <section id="dashboard" class="view-section active">
                <div class="summary-cards">
                    <div class="card summary-card balance" aria-live="polite">
                        <h3>Total Balance</h3>
                        <p class="amount" id="total-amount-display">$0.00</p>
                    </div>
                    <div class="card summary-card total-records" aria-live="polite">
                        <h3>Total Records</h3>
                        <p class="amount" id="total-records-display">0</p>
                    </div>
                    <div class="card summary-card top-category" aria-live="polite">
                        <h3>Top Category</h3>
                        <p class="amount" id="top-category-display">-</p>
                    </div>
                </div>

                <div class="charts-container">
                    <div class="card chart-card">
                        <h3>Last 7 Days Spending</h3>
                        <div id="trend-chart-container">
                            <!-- Chart rendered by dashboard.js -->
                        </div>
                    </div>
                    <div class="card recent-activity">
                        <h3>Recent Activity</h3>
                        <ul class="activity-list">
                            <!-- Dynamic Content -->
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="scripts/app.js"></script>
    <script src="scripts/dashboard.js"></script>
</body>

</html>
