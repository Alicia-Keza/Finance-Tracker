<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Tests</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: #f9f9f9;
        }

        .group {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }

        .test {
            padding: 8px;
            margin: 4px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .valid {
            background: #e6ffed;
            color: #22863a;
        }

        .invalid {
            background: #ffeef0;
            color: #cb2431;
        }

        code {
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <h1>Validation Tests</h1>
    <div id="results"></div>

    <script>
        const regex = {
            // Must contain at least one letter
            description: /^(?=.*[A-Za-z])[A-Za-z0-9 .,!?-]+$/,

            // Positive numbers only with optional 1-2 decimals
            amount: /^(0|[1-9]\d*)(\.\d{1,2})?$/,

            // Letters only, words separated by space or hyphen
            category: /^[A-Za-z]+(?:[ -][A-Za-z]+)*$/,

            // Detect duplicate consecutive words
            duplicates: /\b(\w+)\s+\1\b/i
        };

        const tests = [
            {
                name: "Description",
                regex: regex.description,
                cases: [
                    "Lunch with friends",
                    "12345",
                    "10.50",
                    "Room 101",
                    "   "
                ]
            },
            {
                name: "Amount",
                regex: regex.amount,
                cases: [
                    "50",
                    "10.50",
                    "-5",
                    "abc"
                ]
            },
            {
                name: "Category",
                regex: regex.category,
                cases: [
                    "Food",
                    "Other-Income",
                    "123"
                ]
            },
            {
                name: "Duplicates",
                regex: regex.duplicates,
                cases: [
                    "Lunch Lunch",
                    "Healthy Food"
                ]
            }
        ];

        const container = document.getElementById('results');

        tests.forEach(group => {
            const div = document.createElement('div');
            div.className = 'group';
            div.innerHTML = `<h3>${group.name}</h3>`;

            group.cases.forEach(value => {

                const trimmedValue = value.trim();

                // Create fresh regex instance (safe)
                const pattern = new RegExp(group.regex.source, group.regex.flags);

                const isValid = pattern.test(trimmedValue);

                div.innerHTML += `
                    <div class="test ${isValid ? 'valid' : 'invalid'}">
                        <span>"${value}"</span>
                        <b>${isValid ? 'VALID' : 'INVALID'}</b>
                    </div>
                `;
            });

            container.appendChild(div);
        });
    </script>
</body>

</html>
