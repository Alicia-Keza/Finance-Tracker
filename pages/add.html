<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new financial transaction.">
    <title>Add Transaction - Student Finance Tracker</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <nav class="main-nav" role="navigation" aria-label="Main Navigation">
            <div class="nav-brand">
                <span class="brand-icon"></span>
                <span class="brand-text">FinanceTracker</span>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html"><span class="icon"></span><span class="label">Dashboard</span></a></li>
                <li><a href="records.html"><span class="icon"></span><span class="label">Records</span></a></li>
                <li><a href="add.html" class="active" aria-current="page"><span class="icon"></span><span
                            class="label">Add New</span></a></li>
                <li><a href="settings.html"><span class="icon"></span><span class="label">Settings</span></a></li>
                <li><a href="about.html"><span class="icon"></span><span class="label">About</span></a></li>
            </ul>
        </nav>

        <main id="main-content">
            <header class="top-header">
                <h1>Add Transaction</h1>
            </header>

            <section id="add" class="view-section active">
                <form class="transaction-form">
                    <div id="error-container" class="error-message"></div>
                    <div class="form-group">
                        <label for="desc">Description</label>
                        <input type="text" id="desc" name="description" placeholder="e.g. lunch" required>
                        <small class="field-error" id="desc-error"></small>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount</label>
                            <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" required>
                            <small class="field-error" id="amount-error"></small>
                        </div>
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type" name="type">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <!-- Dynamically populated by add.js -->
                        </select>
                        <small class="field-error" id="category-error"></small>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                        <small class="field-error" id="date-error"></small>
                    </div>
                    <div class="form-actions">
                        <a href="../index.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Transaction</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="../scripts/app.js"></script>
    <script src="../scripts/add.js"></script>
</body>

</html>
