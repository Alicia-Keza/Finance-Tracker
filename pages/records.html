<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your financial transactions.">
    <title>Records - Student Finance Tracker</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <nav class="main-nav" role="navigation" aria-label="Main Navigation">
            <div class="nav-brand">
                <span class="brand-icon"></span>
                <span class="brand-text">FinanceTracker</span>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html"><span class="icon"></span><span class="label">Dashboard</span></a></li>
                <li><a href="records.html" class="active" aria-current="page"><span class="icon"></span><span
                            class="label">Records</span></a></li>
                <li><a href="add.html"><span class="icon"></span><span class="label">Add New</span></a></li>
                <li><a href="settings.html"><span class="icon"></span><span class="label">Settings</span></a></li>
                <li><a href="about.html"><span class="icon"></span><span class="label">About</span></a></li>
            </ul>
        </nav>

        <main id="main-content">
            <!-- Header -->
            <header class="top-header">
                <h1>Records</h1>
            </header>

            <section id="records" class="view-section active">
                <div class="controls-bar">
                    <div class="search-box">
                        <label for="search-input" class="sr-only">Search transactions</label>
                        <span class="search-icon"></span>
                        <input type="text" id="search-input" placeholder="Search (e.g., 'coffee', >50)...">
                    </div>
                    <div class="filters">
                        <select id="sort-select" aria-label="Sort transactions">
                            <option value="date-desc">Date (Newest)</option>
                            <option value="date-asc">Date (Oldest)</option>
                            <option value="amount-desc">Amount (High-Low)</option>
                            <option value="amount-asc">Amount (Low-High)</option>
                        </select>
                        <button class="btn-filter" aria-label="Filter options">Filter</button>
                    </div>
                </div>

                <div class="table-container">
                    <table class="records-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td data-label="Date">2025-09-25</td>
                                <td data-label="Description">Chemistry Textbook</td>
                                <td data-label="Category"><span class="badge books">Books</span></td>
                                <td data-label="Amount" class="amount negative">-$89.99</td>
                                <td data-label="Actions">
                                    <button class="btn-icon edit" aria-label="Edit transaction">Edit</button>
                                    <button class="btn-icon delete" aria-label="Delete transaction">Del</button>
                                </td>
                            </tr>
                            <tr>
                                <td data-label="Date">2025-09-28</td>
                                <td data-label="Description">Tutoring Income</td>
                                <td data-label="Category"><span class="badge income">Income</span></td>
                                <td data-label="Amount" class="amount positive">+$50.00</td>
                                <td data-label="Actions">
                                    <button class="btn-icon edit" aria-label="Edit transaction">Edit</button>
                                    <button class="btn-icon delete" aria-label="Delete transaction">Del</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
